name: Verify application
on: [push, pull_request]
permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: serveza_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DJANGO_EMAIL_BACKEND: console
      SITE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Select test database
        if: matrix.database == 'postgres'
        run: echo 'DATABASE_URL=postgresql://postgres:ci-test-only@127.0.0.1:5432/serveza_ci' >> "$GITHUB_ENV"
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test core --noinput
      - run: python manage.py collectstatic --noinput
      - name: Install test browser
        run: python -m playwright install --with-deps chrome
      - name: Browser regressions together
        run: python manage.py test scripts.test_restaurant_ui scripts.test_login_ui scripts.test_subscription_ui scripts.test_audit_repairs_ui --noinput
      - name: Browser regressions in reverse order
        run: python manage.py test scripts.test_restaurant_ui scripts.test_login_ui scripts.test_subscription_ui scripts.test_audit_repairs_ui --noinput --reverse
