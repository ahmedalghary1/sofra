{% load showroom %}
<div class="mk-faq-list{% if accordion %} mk-faq-cards{% endif %}">
  {% for question,answer in faq_rows %}
  <details{% if accordion %} name="page-faq"{% endif %}>
    <summary>{{ question }}{% symbol 'chevron' %}</summary>
    <p>{{ answer }}</p>
  </details>
  {% endfor %}
</div>
