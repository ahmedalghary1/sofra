{% load showroom %}
{% if selected_plan %}
<section class="mk-note" aria-label="{% bi 'الباقة المختارة' 'Selected plan' %}">
  <h2 lang="en" dir="ltr">{{ selected_plan.name }}</h2>
  <p>{% bi 'السعر الشهري' 'Monthly price' %} · <bdi>{{ selected_plan.price }}</bdi> {% bi 'ج.م' 'EGP' %}</p>
  <dl>{% for key,label,count in selected_plan.rows %}<div><dt>{{ label }}</dt><dd data-tier-limit="{{ key }}">{{ count }}</dd></div>{% endfor %}</dl>
</section>
{% endif %}
