{% load static %}<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F2A3D">
  <meta name="application-name" content="Serveza">
  <meta name="description" content="Serveza — ضيافة ذكية.. وخدمة بلا انتظار. منيو QR وطلبات الطاولات وشاشة المطبخ وإدارة الخدمة في مكان واحد.">
  <title>{% block title %}ضيافة ذكية.. وخدمة بلا انتظار{% endblock %} | Serveza</title>
  <link rel="icon" type="image/webp" sizes="32x32" href="{% static 'brand/serveza-favicon-32.webp' %}">
  <link rel="icon" type="image/webp" sizes="192x192" href="{% static 'brand/serveza-icon-192.webp' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'brand/serveza-apple-touch.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=serveza-hero">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% if messages %}<div class="toast-stack" role="status">{% for message in messages %}<div class="toast {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
  {% block body %}{% endblock %}
</body>
</html>
