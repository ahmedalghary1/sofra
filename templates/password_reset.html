{% extends 'base.html' %}{% block title %}استعادة الحساب{% endblock %}
{% block body %}<div class="reset-shell"><a class="brand" href="/"><span class="brand-mark">✳</span><span>سفرة</span></a><div class="reset-card"><span class="eyebrow">استعادة الحساب</span><h1>نسيت كلمة المرور؟</h1><p>اكتب بريدك الإلكتروني وسنرسل رابطًا لتعيين كلمة مرور جديدة إذا كان الحساب موجودًا.</p><form method="post" class="stack-form">{% csrf_token %}<label>البريد الإلكتروني<input type="email" name="email" required autocomplete="email" placeholder="name@example.com"></label><button class="btn btn-primary btn-full">إرسال رابط الاستعادة ←</button></form><a class="reset-back" href="{% url 'login' %}">العودة لتسجيل الدخول</a></div></div>{% endblock %}
